# ============================================================================
# Render — infrastructure décrite en fichier (Blueprint)
#
# Déploiement : Render → New → Blueprint → choisir ce dépôt.
# Tout est créé automatiquement : le service web, la base et le cache.
#
# Les variables marquées sync:false sont à renseigner dans l'interface
# Render après la création — elles ne doivent jamais figurer dans le dépôt.
# ============================================================================

# ============================================================================
# Base de données : externe (Neon, Supabase ou Render payant).
#
# Le palier gratuit de Render n'autorise qu'une seule base par espace de
# travail, et celle-ci expire au bout de 30 jours. Une base externe laisse
# l'existante intacte et n'a pas de date de péremption.
#
# Renseigner DATABASE_URL dans les variables du service après création.
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Service web : API + interface + worker dans un seul processus
  # --------------------------------------------------------------------------
  - type: web
    name: atelier
    runtime: node
    plan: free          # le plan gratuit s'endort après 15 min d'inactivité
    region: frankfurt   # le plus proche de la Tunisie
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run migrate:prod -- --seed && npm start
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Chaîne de connexion de la base externe.
      #
      # Chez Neon, prendre la chaîne DIRECTE, pas la "pooled" : celle-ci
      # passe par PgBouncer en mode transaction, où les verrous consultatifs
      # de session (pg_try_advisory_lock) ne survivent pas d'une requête à
      # l'autre. Les tâches planifiées se bloqueraient en silence et des
      # réservations de crédits resteraient gelées.
      # L'hôte correct ne contient PAS le segment "-pooler".
      # Terminer la chaîne par ?sslmode=require.
      - key: DATABASE_URL
        sync: false

      # Facultatif. Sans Redis, la file bascule en mémoire : utilisable pour
      # un test, mais les travaux en attente sont perdus au redémarrage (les
      # crédits gelés correspondants expirent et sont rendus au client).
      # À brancher avant la mise en service réelle.
      - key: REDIS_URL
        sync: false

      # Généré par Render à la création, puis jamais modifié : le changer
      # déconnecte toutes les sessions en cours.
      - key: JWT_SECRET
        generateValue: true

      # Secret du hachage des codes — réservé pour la reprise éventuelle
      # des cartes à gratter.
      - key: CODE_PEPPER
        generateValue: true

      # À remplacer par l'URL réelle du service après le premier déploiement.
      # Konnect s'en sert pour les retours de paiement et le webhook.
      - key: PUBLIC_BASE_URL
        sync: false

      # ---- Stockage ---------------------------------------------------------
      # Le disque de Render est éphémère : sans S3/R2, les fichiers produits
      # disparaissent à chaque redéploiement. Indispensable en production.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false     # ex. https://<compte>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto

      # ---- Fournisseurs d'IA ------------------------------------------------
      # Tous facultatifs. Sans aucune clé, le mode démonstration reste actif
      # et la plateforme est pleinement navigable.
      - key: BYTEPLUS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false

      # ---- Paiement par carte (Konnect) -------------------------------------
      - key: KONNECT_API_KEY
        sync: false
      - key: KONNECT_WALLET_ID
        sync: false
      - key: KONNECT_BASE_URL
        value: https://api.konnect.network/api/v2

      # ---- Règles métier ----------------------------------------------------
      - key: SIGNUP_BONUS_CREDITS
        value: "100"
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: DEDUP_ENABLED
        value: "true"
      - key: MAX_BATCH_ROWS
        value: "500"
      - key: MAX_UPLOAD_MB
        value: "15"
